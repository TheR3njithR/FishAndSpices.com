name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Railway staging
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'release/')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.41.2

      - name: Validate required secrets
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets['RAILWAY_TOKEN'] }}
          RAILWAY_PROJECT_ID: ${{ secrets['RAILWAY_PROJECT_ID'] }}
          RAILWAY_STAGING_SERVICE: ${{ secrets['RAILWAY_STAGING_SERVICE'] }}
          RAILWAY_STAGING_ENVIRONMENT: ${{ secrets['RAILWAY_STAGING_ENVIRONMENT'] }}
        run: |
          for key in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_STAGING_SERVICE RAILWAY_STAGING_ENVIRONMENT; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: ${key}"
              exit 1
            fi
          done

      - name: Deploy staging revision
        env:
          RAILWAY_TOKEN: ${{ secrets['RAILWAY_TOKEN'] }}
          RAILWAY_PROJECT_ID: ${{ secrets['RAILWAY_PROJECT_ID'] }}
          RAILWAY_STAGING_SERVICE: ${{ secrets['RAILWAY_STAGING_SERVICE'] }}
          RAILWAY_STAGING_ENVIRONMENT: ${{ secrets['RAILWAY_STAGING_ENVIRONMENT'] }}
        run: |
          railway up --ci --detach \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_STAGING_SERVICE" \
            --environment "$RAILWAY_STAGING_ENVIRONMENT" \
            --message "github:${GITHUB_SHA}"
