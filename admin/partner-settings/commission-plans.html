<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Commission Plans | Fish &amp; Spices</title>
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css?v=9">
  <link rel="stylesheet" href="/admin/admin.css?v=3">
  <link rel="stylesheet" href="/assets/css/partner-network.css">
  <script src="/admin/partners-admin.js" defer></script>
</head>
<body class="inner-page admin-page partner-shell" data-admin-partner-page="plans">
  <header class="partner-topbar">
    <a class="brand" href="/admin"><img src="/assets/brand/logo-mark.svg" width="44" height="44" alt=""><span class="brand-copy"><strong>Fish <span>&amp;</span> Spices</strong><small>Administrator workspace</small></span></a>
    <nav class="partner-nav" aria-label="Admin partner navigation">
      <a href="/admin/partners.html">Partners</a>
      <a href="/admin/partner-settings.html">Settings</a>
      <a href="/admin/partner-settings/commission-plans.html" aria-current="page">Commission plans</a>
      <a href="/admin/index.html">Lead operations</a>
    </nav>
  </header>

  <main class="partner-main">
    <section class="partner-card">
      <h1>Commission plans and rules</h1>
      <p>Create configurable plans and inspect event-wise reward rules.</p>
      <p class="partner-status" data-admin-partner-status></p>
    </section>

    <section class="partner-card" style="margin-top:14px;">
      <h2>Create plan</h2>
      <form class="partner-form" data-admin-create-plan>
        <div class="row">
          <label>Plan name
            <input name="name" required maxlength="160" placeholder="Regional partner plan"></label>
          <label>Currency
            <select name="currency"><option>INR</option><option>AED</option><option>USD</option><option>EUR</option><option>GBP</option></select>
          </label>
        </div>
        <label>Description
          <textarea name="description" maxlength="2000" placeholder="Define the plan intent and review cycle."></textarea>
        </label>
        <button class="button button-dark" type="submit">Create plan</button>
      </form>
    </section>

    <section class="partner-card" style="margin-top:14px;">
      <h2>Existing plans</h2>
      <div data-admin-commission-plans>Loading plans...</div>
    </section>
  </main>
</body>
</html>
